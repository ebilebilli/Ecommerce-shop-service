name: Django CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shop_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv (fast Python package manager)
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies from pyproject/uv.lock
        run: |
          uv sync --frozen

      - name: Run migrations
        env:
          SECRET_KEY: test-ci-key
          DEBUG: '0'
          ALLOWED_HOSTS: '*'
          POSTGRES_DB: shop_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: |
          uv run python shop_service/manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: test-ci-key
          DEBUG: '0'
          ALLOWED_HOSTS: '*'
          POSTGRES_DB: shop_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: |
          uv run pytest -q